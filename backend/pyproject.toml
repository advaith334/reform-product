[project]
name = "reform"
version = "0.1.0"
description = "Extract structured fields from trade documents with Mistral OCR into Postgres"
requires-python = ">=3.11"
dependencies = [
    "mistralai>=2.9",
    "pydantic>=2",
    "psycopg[binary]>=3",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "psycopg-pool>=3.2",
]

[project.scripts]
reform = "reform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reform"]

[tool.uv]
# The conda base Python on this machine does not process .pth files, which silently
# breaks editable installs (`import reform` fails). Force a uv-managed interpreter.
python-preference = "only-managed"
